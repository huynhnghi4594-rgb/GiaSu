<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="/">🎓 Tìm Gia Sư</a>
    <div class="nav-links">
      <a href="login.html">Đăng nhập</a>
      <a href="register.html">Đăng ký</a>
    </div>
  </nav>

  <div class="container" style="max-width:420px">
    <div class="card" style="margin-top:60px">
      <h1>Đăng nhập</h1>
      <div id="msg"></div>
      <input type="email" id="email" placeholder="Email">
      <input type="password" id="password" placeholder="Mật khẩu">
      <button class="btn-primary" style="width:100%" onclick="login()">Đăng nhập</button>
      <p style="text-align:center;margin-top:14px;font-size:0.9rem;color:#6b7280">
        Chưa có tài khoản? <a href="register.html" style="color:#2563eb">Đăng ký</a>
      </p>
    </div>
  </div>

  <script>
    async function login() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (!res.ok) { msg.innerHTML = `<p class="error">${data.error}</p>`; return; }

      localStorage.setItem('token', data.token);
      localStorage.setItem('user', JSON.stringify(data.user));
      location.href = data.user.role === 'tutor' ? 'tutor-dashboard.html' : 'student-dashboard.html';
    }
  </script>
</body>
</html>
