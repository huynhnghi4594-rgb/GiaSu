<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Gia Sư</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav>
    <a href="/">🎓 Tìm Gia Sư</a>
    <div class="nav-links">
      <span id="userName" style="color:rgba(255,255,255,0.85);font-size:0.9rem"></span>
      <button onclick="logout()">Đăng xuất</button>
    </div>
  </nav>

  <div class="container">
    <h1>Dashboard Gia Sư</h1>

    <!-- Profile -->
    <div class="card">
      <h2>📝 Hồ sơ của tôi</h2>
      <div id="profileMsg"></div>
      <textarea id="bio" placeholder="Giới thiệu bản thân..."></textarea>
      <input type="number" id="hourlyRate" placeholder="Học phí (đ/giờ)">
      <button class="btn-primary" onclick="saveProfile()">Lưu hồ sơ</button>
    </div>

    <!-- Subjects -->
    <div class="card">
      <h2>📚 Môn học giảng dạy</h2>
      <div id="subjectMsg"></div>
      <div class="form-row">
        <input type="text" id="subjectName" placeholder="Tên môn học (VD: Toán, Lý...)">
        <select id="subjectLevel">
          <option value="Tiểu học">Tiểu học</option>
          <option value="THCS">THCS</option>
          <option value="THPT">THPT</option>
          <option value="Đại học">Đại học</option>
          <option value="Người đi làm">Người đi làm</option>
        </select>
        <button class="btn-primary" onclick="addSubject()">Thêm</button>
      </div>
      <div id="subjectList"></div>
    </div>

    <!-- Schedules -->
    <div class="card">
      <h2>🗓️ Lịch dạy</h2>
      <div id="scheduleMsg"></div>
      <div class="form-row">
        <select id="dayOfWeek">
          <option value="Thứ 2">Thứ 2</option>
          <option value="Thứ 3">Thứ 3</option>
          <option value="Thứ 4">Thứ 4</option>
          <option value="Thứ 5">Thứ 5</option>
          <option value="Thứ 6">Thứ 6</option>
          <option value="Thứ 7">Thứ 7</option>
          <option value="Chủ nhật">Chủ nhật</option>
        </select>
        <input type="time" id="startTime">
        <input type="time" id="endTime">
        <button class="btn-primary" onclick="addSchedule()">Thêm</button>
      </div>
      <div id="scheduleList"></div>
    </div>

    <!-- Bookings -->
    <div class="card">
      <h2>📋 Đơn đăng ký học</h2>
      <div id="bookingList"></div>
    </div>
  </div>

  <script>
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (!token || !user || user.role !== 'tutor') { location.href = 'login.html'; }
    document.getElementById('userName').textContent = 'Xin chào, ' + user.name;

    function logout() { localStorage.clear(); location.href = '/'; }
    const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

    async function loadProfile() {
      const res = await fetch('/api/tutors/profile/me', { headers });
      if (!res.ok) return;
      const data = await res.json();
      document.getElementById('bio').value = data.bio || '';
      document.getElementById('hourlyRate').value = data.hourly_rate || '';
      renderSubjects(data.subjects);
      renderSchedules(data.schedules);
    }

    async function saveProfile() {
      const bio = document.getElementById('bio').value;
      const hourly_rate = document.getElementById('hourlyRate').value;
      const res = await fetch('/api/tutors/profile', { method: 'PUT', headers, body: JSON.stringify({ bio, hourly_rate: parseInt(hourly_rate) || 0 }) });
      const data = await res.json();
      document.getElementById('profileMsg').innerHTML = `<p class="${res.ok ? 'success' : 'error'}">${data.message || data.error}</p>`;
    }

    async function addSubject() {
      const name = document.getElementById('subjectName').value;
      const level = document.getElementById('subjectLevel').value;
      const res = await fetch('/api/tutors/subjects', { method: 'POST', headers, body: JSON.stringify({ name, level }) });
      const data = await res.json();
      document.getElementById('subjectMsg').innerHTML = `<p class="${res.ok ? 'success' : 'error'}">${data.message || data.error}</p>`;
      if (res.ok) { document.getElementById('subjectName').value = ''; loadProfile(); }
    }

    async function deleteSubject(id) {
      await fetch('/api/tutors/subjects/' + id, { method: 'DELETE', headers });
      loadProfile();
    }

    function renderSubjects(subjects) {
      document.getElementById('subjectList').innerHTML = subjects.length
        ? subjects.map(s => `
            <span class="tag" style="margin:3px">
              ${s.name} (${s.level})
              <button onclick="deleteSubject(${s.id})" style="background:none;border:none;color:#ef4444;cursor:pointer;font-size:0.8rem;padding:0 2px">✕</button>
            </span>`).join('')
        : '<p style="color:#9ca3af;font-size:0.88rem">Chưa có môn học nào</p>';
    }

    async function addSchedule() {
      const day_of_week = document.getElementById('dayOfWeek').value;
      const start_time = document.getElementById('startTime').value;
      const end_time = document.getElementById('endTime').value;
      const res = await fetch('/api/tutors/schedules', { method: 'POST', headers, body: JSON.stringify({ day_of_week, start_time, end_time }) });
      const data = await res.json();
      document.getElementById('scheduleMsg').innerHTML = `<p class="${res.ok ? 'success' : 'error'}">${data.message || data.error}</p>`;
      if (res.ok) loadProfile();
    }

    async function deleteSchedule(id) {
      await fetch('/api/tutors/schedules/' + id, { method: 'DELETE', headers });
      loadProfile();
    }

    function renderSchedules(schedules) {
      document.getElementById('scheduleList').innerHTML = schedules.length
        ? `<table><thead><tr><th>Ngày</th><th>Giờ bắt đầu</th><th>Giờ kết thúc</th><th></th></tr></thead><tbody>
            ${schedules.map(s => `<tr>
              <td>${s.day_of_week}</td><td>${s.start_time}</td><td>${s.end_time}</td>
              <td><button class="btn-danger btn-sm" onclick="deleteSchedule(${s.id})">Xóa</button></td>
            </tr>`).join('')}
           </tbody></table>`
        : '<p style="color:#9ca3af;font-size:0.88rem">Chưa có lịch dạy nào</p>';
    }

    async function loadBookings() {
      const res = await fetch('/api/bookings/incoming', { headers });
      const bookings = await res.json();
      document.getElementById('bookingList').innerHTML = bookings.length
        ? `<table><thead><tr><th>Học sinh</th><th>Môn</th><th>Lịch</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody>
            ${bookings.map(b => `<tr>
              <td>${b.student_name}</td>
              <td>${b.subject}</td>
              <td>${b.day_of_week} ${b.start_time}-${b.end_time}</td>
              <td><span class="badge badge-${b.status}">${b.status === 'pending' ? 'Chờ duyệt' : b.status === 'accepted' ? 'Đã nhận' : 'Từ chối'}</span></td>
              <td>${b.status === 'pending' ? `
                <button class="btn-success btn-sm" onclick="updateBooking(${b.id},'accepted')">Nhận</button>
                <button class="btn-danger btn-sm" onclick="updateBooking(${b.id},'rejected')" style="margin-left:4px">Từ chối</button>` : '—'}
              </td>
            </tr>`).join('')}
           </tbody></table>`
        : '<p style="color:#9ca3af;font-size:0.88rem">Chưa có đơn đăng ký nào</p>';
    }

    async function updateBooking(id, status) {
      await fetch('/api/bookings/' + id + '/status', { method: 'PUT', headers, body: JSON.stringify({ status }) });
      loadBookings();
    }

    loadProfile();
    loadBookings();
  </script>
</body>
</html>
