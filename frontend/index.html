<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tìm Gia Sư</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // Tự động chuyển hướng về trang tổng quan nếu đã đăng nhập
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    if (token && user) {
      if (user.role === 'admin') {
        location.href = 'admin-dashboard.html';
      } else if (user.role === 'accountant') {
        location.href = 'accountant-dashboard.html';
      } else if (user.role === 'tutor') {
        location.href = 'tutor-dashboard.html';
      } else {
        location.href = 'student-dashboard.html';
      }
    }
  </script>
</head>
<body>
  <nav>
    <a href="index.html">🎓 Tìm Gia Sư</a>
    <div class="nav-links" id="navLinks">
      <a href="login.html">Đăng nhập</a>
      <a href="register.html">Đăng ký</a>
    </div>
  </nav>

  <div class="container">
    <!-- HERO -->
    <div class="card hero">
      <h1>Tìm gia sư phù hợp với bạn</h1>
      <p>Kết nối học sinh với gia sư chất lượng — nhanh chóng, dễ dàng, thông minh</p>
      <div class="hero-btns">
        <a href="register.html" class="primary">Đăng ký ngay</a>
        <a href="#search" class="secondary">Tìm gia sư</a>
      </div>
    </div>

    <!-- GỢI Ý THÔNG MINH (chỉ hiện khi đăng nhập là student) -->
    <div class="card" id="recommendSection" style="display:none">
      <div class="section-header">
        <h2>✨ Gợi ý gia sư phù hợp với bạn</h2>
        <span style="font-size:0.82rem;color:#6b7280">Dựa trên môn học bạn quan tâm</span>
      </div>
      <div id="recommendList"><div class="loading">Đang tải gợi ý</div></div>
    </div>

    <!-- TÌM KIẾM -->
    <div class="card" id="search">
      <h2>🔍 Tìm kiếm gia sư</h2>

      <!-- Bộ lọc cơ bản -->
      <div class="form-row" style="margin-bottom:8px">
        <input type="text" id="searchSubject" placeholder="Môn học (VD: Toán, Anh văn...)">
        <select id="searchLevel">
          <option value="">-- Tất cả cấp độ --</option>
          <option value="Tiểu học">Tiểu học</option>
          <option value="THCS">THCS</option>
          <option value="THPT">THPT</option>
          <option value="Đại học">Đại học</option>
          <option value="Người đi làm">Người đi làm</option>
        </select>
        <button class="btn-primary" onclick="searchTutors()">Tìm kiếm</button>
      </div>

      <!-- Toggle bộ lọc nâng cao -->
      <button class="btn-secondary btn-sm" onclick="toggleAdvanced()" style="margin-bottom:12px">
        ⚙️ Bộ lọc nâng cao
      </button>

      <!-- Bộ lọc nâng cao -->
      <div class="filter-panel" id="advancedFilter" style="display:none">
        <h3>Lọc nâng cao</h3>
        <div class="filter-grid">
          <div>
            <label style="font-size:0.82rem;color:#6b7280;display:block;margin-bottom:4px">Học phí từ (đ/giờ)</label>
            <input type="number" id="minPrice" placeholder="VD: 100000">
          </div>
          <div>
            <label style="font-size:0.82rem;color:#6b7280;display:block;margin-bottom:4px">Học phí đến (đ/giờ)</label>
            <input type="number" id="maxPrice" placeholder="VD: 500000">
          </div>
          <div>
            <label style="font-size:0.82rem;color:#6b7280;display:block;margin-bottom:4px">Ngày dạy</label>
            <select id="dayOfWeek">
              <option value="">-- Tất cả ngày --</option>
              <option value="Thứ 2">Thứ 2</option>
              <option value="Thứ 3">Thứ 3</option>
              <option value="Thứ 4">Thứ 4</option>
              <option value="Thứ 5">Thứ 5</option>
              <option value="Thứ 6">Thứ 6</option>
              <option value="Thứ 7">Thứ 7</option>
              <option value="Chủ nhật">Chủ nhật</option>
            </select>
          </div>
          <div>
            <label style="font-size:0.82rem;color:#6b7280;display:block;margin-bottom:4px">Sắp xếp theo</label>
            <select id="sortBy">
              <option value="">-- Mặc định --</option>
              <option value="price_asc">Giá thấp → cao</option>
              <option value="price_desc">Giá cao → thấp</option>
            </select>
          </div>
        </div>
        <div class="filter-actions">
          <button class="btn-primary btn-sm" onclick="searchTutors()">Áp dụng</button>
          <button class="btn-secondary btn-sm" onclick="resetFilters()">Xóa bộ lọc</button>
        </div>
      </div>

      <div id="searchResults"></div>
    </div>
  </div>

  <!-- MODALS -->
  <div id="tutorDetailModal" class="modal" style="display:none">
    <div class="modal-content card">
      <span class="close-btn" onclick="closeModal('tutorDetailModal')">&times;</span>
      <div id="modalTutorInfo"></div>
      <div class="modal-footer" style="margin-top:20px; display:flex; gap:10px;">
        <button class="btn-primary" id="modalBookBtn">Đặt lịch học</button>
        <button class="btn-secondary" onclick="closeModal('tutorDetailModal')">Đóng</button>
      </div>
    </div>
  </div>

  <div id="authAlertModal" class="modal" style="display:none">
    <div class="modal-content card" style="max-width:400px; text-align:center;">
      <h2 style="margin-bottom:12px">⚠️ Yêu cầu đăng nhập</h2>
      <p id="authAlertText" style="margin-bottom:20px; color:#64748b"></p>
      <div style="display:flex; gap:10px; justify-content:center">
        <button class="btn-primary" onclick="redirectToLogin()">Đăng nhập</button>
        <button class="btn-secondary" onclick="closeModal('authAlertModal')">Hủy</button>
      </div>
    </div>
  </div>

  <script>
    const API = 'http://localhost:5000/api';
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');

    // Cập nhật nav
    if (user) {
      document.getElementById('navLinks').innerHTML = `
        <span style="color:rgba(255,255,255,0.85);font-size:0.9rem">Xin chào, ${user.name}</span>
        <a href="${user.role === 'tutor' ? 'tutor-dashboard.html' : 'student-dashboard.html'}">Dashboard</a>
        <button onclick="logout()">Đăng xuất</button>
      `;
      // Nếu là student, load gợi ý
      if (user.role === 'student') {
        document.getElementById('recommendSection').style.display = 'block';
        loadRecommendations();
      }
    }

    function logout() { localStorage.clear(); location.reload(); }

    function toggleAdvanced() {
      const panel = document.getElementById('advancedFilter');
      panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
    }

    function resetFilters() {
      document.getElementById('minPrice').value = '';
      document.getElementById('maxPrice').value = '';
      document.getElementById('dayOfWeek').value = '';
      document.getElementById('sortBy').value = '';
      searchTutors();
    }

    // Modal Helpers
    function showModal(id) { document.getElementById(id).style.display = 'flex'; }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }
    function redirectToLogin() { location.href = 'login.html'; }

    // Load gợi ý gia sư bằng cosine similarity
    async function loadRecommendations() {
      try {
        const res = await fetch(API + '/tutors/recommendations', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const tutors = await res.json();
        const el = document.getElementById('recommendList');

        if (!res.ok || !tutors.length) {
          el.innerHTML = `<p style="color:#9ca3af;font-size:0.88rem">
            Chưa có gợi ý. Hãy cập nhật môn học yêu thích trong hồ sơ.
          </p>`;
          return;
        }

        el.innerHTML = tutors.map(t => renderTutorCard(t, true)).join('');
      } catch (err) {
        document.getElementById('recommendList').innerHTML =
          '<p style="color:#ef4444;font-size:0.88rem">Không thể tải gợi ý.</p>';
      }
    }

    async function searchTutors() {
      const subject = document.getElementById('searchSubject').value.trim();
      const level = document.getElementById('searchLevel').value;
      const minPrice = document.getElementById('minPrice').value;
      const maxPrice = document.getElementById('maxPrice').value;
      const dayOfWeek = document.getElementById('dayOfWeek').value;
      const sortBy = document.getElementById('sortBy').value;

      const params = new URLSearchParams();
      if (subject) params.append('subject', subject);
      if (level) params.append('level', level);
      if (minPrice) params.append('min_price', minPrice);
      if (maxPrice) params.append('max_price', maxPrice);
      if (dayOfWeek) params.append('day_of_week', dayOfWeek);
      if (sortBy === 'price_asc') { params.append('sort_by', 'price'); params.append('order', 'asc'); }
      if (sortBy === 'price_desc') { params.append('sort_by', 'price'); params.append('order', 'desc'); }

      const el = document.getElementById('searchResults');
      el.innerHTML = '<div class="loading">Đang tìm kiếm</div>';

      try {
        const res = await fetch(API + '/tutors/search?' + params);
        const tutors = await res.json();

        if (!tutors.length) {
          el.innerHTML = `<div class="empty-state"><div class="icon">🔍</div><p>Không tìm thấy gia sư phù hợp</p></div>`;
          return;
        }

        el.innerHTML = `<p style="color:#6b7280;font-size:0.85rem;margin-bottom:12px">Tìm thấy <strong>${tutors.length}</strong> gia sư</p>` +
          tutors.map(t => renderTutorCard(t, false)).join('');
      } catch (err) {
        el.innerHTML = '<p class="error">Lỗi kết nối server. Vui lòng thử lại.</p>';
      }
    }

    async function showTutorDetails(tutorId) {
      const modalInfo = document.getElementById('modalTutorInfo');
      modalInfo.innerHTML = '<div class="loading">Đang tải hồ sơ...</div>';
      showModal('tutorDetailModal');

      try {
        const res = await fetch(API + '/tutors/' + tutorId);
        if (!res.ok) {
          modalInfo.innerHTML = '<p class="error">Không tìm thấy thông tin gia sư.</p>';
          return;
        }
        const tutor = await res.json();
        
        const subjects = (tutor.subjects || []).map(s =>
          `<span class="tag tag-subject">${s.name}${s.level ? ' · ' + s.level : ''}</span>`
        ).join('');

        const schedules = (tutor.schedules || []).map(s =>
          `<tr>
            <td><strong>${s.day_of_week}</strong></td>
            <td>${s.start_time} - ${s.end_time}</td>
          </tr>`
        ).join('');

        modalInfo.innerHTML = `
          <h2 style="font-size:1.6rem; color:var(--text-dark); margin-bottom:8px">👨‍🏫 Hồ sơ Gia sư: ${tutor.name}</h2>
          <p style="margin-bottom:14px; font-style:italic; color:var(--text-muted)">"${tutor.bio || 'Chưa có giới thiệu'}"</p>
          
          <div style="margin-bottom:18px">
            <h3 style="font-size:1.05rem; margin-bottom:6px">📚 Môn học giảng dạy:</h3>
            <div>${subjects || 'Chưa cập nhật'}</div>
          </div>
          
          <div style="margin-bottom:18px">
            <h3 style="font-size:1.05rem; margin-bottom:6px">💰 Học phí đề xuất:</h3>
            <p style="font-weight:700; color:var(--primary-color)">${tutor.hourly_rate ? tutor.hourly_rate.toLocaleString() + ' đ/giờ' : 'Thỏa thuận'}</p>
          </div>

          <div>
            <h3 style="font-size:1.05rem; margin-bottom:6px">📅 Lịch dạy rảnh:</h3>
            ${tutor.schedules && tutor.schedules.length > 0 ? `
              <table style="width:100%">
                <thead>
                  <tr>
                    <th>Thứ</th>
                    <th>Khung giờ</th>
                  </tr>
                </thead>
                <tbody>
                  ${schedules}
                </tbody>
              </table>
            ` : '<p style="color:var(--text-muted); font-size:0.9rem">Chưa cập nhật lịch rảnh</p>'}
          </div>
        `;

        const bookBtn = document.getElementById('modalBookBtn');
        bookBtn.onclick = () => handleBooking(tutor.id);
      } catch (err) {
        modalInfo.innerHTML = '<p class="error">Lỗi kết nối server. Vui lòng thử lại sau.</p>';
      }
    }

    function handleBooking(tutorId) {
      closeModal('tutorDetailModal');
      if (!user) {
        document.getElementById('authAlertText').textContent = 'Bạn cần đăng nhập tài khoản học sinh để đăng ký học và liên hệ với gia sư.';
        showModal('authAlertModal');
      } else if (user.role !== 'student') {
        alert('Tài khoản gia sư không thể đăng ký thuê gia sư khác.');
      } else {
        location.href = `student-dashboard.html?book=${tutorId}`;
      }
    }

    function renderTutorCard(t, showSimilarity) {
      const subjects = (t.subjects || []).map(s =>
        `<span class="tag tag-subject">${s.name}${s.level ? ' · ' + s.level : ''}</span>`
      ).join('');

      const similarityBadge = (showSimilarity && t.similarity_score != null)
        ? `<div><span class="similarity-badge">⭐ Phù hợp ${Math.round(t.similarity_score * 100)}%</span></div>`
        : '';

      return `
        <div class="tutor-card">
          ${similarityBadge}
          <h3>👨‍🏫 ${t.name}</h3>
          <p>${t.bio || 'Chưa có giới thiệu'}</p>
          <p>💰 ${t.hourly_rate ? t.hourly_rate.toLocaleString() + ' đ/giờ' : 'Thỏa thuận'}</p>
          <div style="margin:8px 0">${subjects}</div>
          <div style="margin-top:14px; display:flex; gap:8px">
            <button class="btn-secondary btn-sm" onclick="showTutorDetails('${t.id}')">
              🔍 Xem hồ sơ
            </button>
            <button class="btn-primary btn-sm" onclick="handleBooking('${t.id}')">
              📅 Đặt lịch học
            </button>
          </div>
        </div>`;
    }

    // Load kết quả mặc định khi vào trang
    searchTutors();
  </script>
</body>
</html>
